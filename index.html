<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dokumentasi Operasional</title>
  <style>
    /* Reset & Base Styles - Ringan tanpa animasi berat untuk HP RAM 1GB+ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      font-size: 15px;
      line-height: 1.4;
      padding-bottom: 92px;
    }

    /* Header */
    .header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 14px 16px;
      border-bottom: 3px solid #2563eb;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .header p {
      font-size: 12px;
      color: #cbd5e1;
    }

    /* Status Bar */
    .status-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      padding: 10px 14px;
      font-size: 13px;
      display: table;
      width: 100%;
    }

    .status-left {
      display: table-cell;
      vertical-align: middle;
    }

    .status-right {
      display: table-cell;
      vertical-align: middle;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-online {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .badge-offline {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .badge-cache {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background-color: #e0e7ff;
      color: #1e40af;
      border: 1px solid #93c5fd;
      margin-left: 4px;
    }

    .queue-summary {
      display: block;
      margin-top: 4px;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-sync-small {
      background-color: #e2e8f0;
      color: #0f172a;
      border: 1px solid #94a3b8;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sync-small:active {
      background-color: #cbd5e1;
    }

    /* Container */
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Card */
    .card {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Kategori Radio */
    .category-list {
      list-style: none;
    }

    .category-item {
      margin-bottom: 8px;
    }

    .category-label {
      display: block;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 11px 12px;
      background-color: #f8fafc;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
    }

    .category-label.selected {
      border-color: #2563eb;
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    .category-radio {
      margin-right: 8px;
      transform: scale(1.2);
      vertical-align: middle;
    }

    /* Input Keterangan */
    .input-group {
      margin-top: 12px;
    }

    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #334155;
    }

    .text-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 14px;
      background-color: #ffffff;
      color: #0f172a;
    }

    .text-input:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* 10 Kolom Foto */
    .slots-grid {
      font-size: 0;
      margin: 0 -4px;
    }

    .slot-wrapper {
      display: inline-block;
      vertical-align: top;
      width: 50%;
      padding: 4px;
      font-size: 13px;
    }

    @media (min-width: 480px) {
      .slot-wrapper {
        width: 33.333%;
      }
    }

    .slot-box {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      background-color: #f8fafc;
      height: 148px;
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .slot-box.has-photo {
      border-style: solid;
      border-color: #16a34a;
      background-color: #0f172a;
    }

    .slot-box.processing {
      border-color: #f59e0b;
      background-color: #fef3c7;
    }

    .slot-trigger {
      display: block;
      width: 100%;
      height: 100%;
      padding-top: 28px;
      cursor: pointer;
      color: #475569;
    }

    .slot-number {
      display: inline-block;
      background-color: #e2e8f0;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .slot-icon {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
      color: #2563eb;
      font-weight: bold;
    }

    .slot-hint {
      font-size: 11px;
      display: block;
      padding: 0 4px;
    }

    .slot-input {
      display: none;
    }

    .slot-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slot-badge-top {
      position: absolute;
      top: 4px;
      left: 4px;
      background-color: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .slot-remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      line-height: 28px;
      text-align: center;
    }

    /* Panel Status Antrean Sinkronisasi */
    .queue-list {
      list-style: none;
      margin-top: 8px;
    }

    .queue-item {
      border: 1px solid #e2e8f0;
      background-color: #f8fafc;
      border-radius: 6px;
      padding: 9px 10px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .queue-item-top {
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .queue-item-meta {
      color: #475569;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .q-status-pending {
      color: #b45309;
      font-weight: 700;
    }

    .q-status-sent {
      color: #15803d;
      font-weight: 700;
    }

    .q-status-failed {
      color: #b91c1c;
      font-weight: 700;
    }

    .queue-actions {
      margin-top: 8px;
      text-align: right;
    }

    .btn-retry {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: 6px;
    }

    .btn-clear-sent {
      background-color: #e2e8f0;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-queue-msg {
      font-size: 12px;
      color: #64748b;
      padding: 6px 0;
    }

    /* Fixed Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #ffffff;
      border-top: 1px solid #cbd5e1;
      padding: 10px 14px;
      z-index: 50;
    }

    .bottom-inner {
      max-width: 640px;
      margin: 0 auto;
    }

    .btn-submit {
      width: 100%;
      background-color: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-submit:active {
      background-color: #15803d;
    }

    /* Toast Notification (Pengganti alert) */
    .toast-box {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 616px;
      margin: 0 auto;
      padding: 13px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      z-index: 100;
      display: none;
      border: 2px solid transparent;
    }

    .toast-success {
      background-color: #166534;
      color: #ffffff;
      border-color: #86efac;
    }

    .toast-error {
      background-color: #991b1b;
      color: #ffffff;
      border-color: #fca5a5;
    }

    .toast-info {
      background-color: #1e40af;
      color: #ffffff;
      border-color: #93c5fd;
    }
  </style>
</head>
<body>

  <!-- Notifikasi Instan -->
  <div id="toastBox" class="toast-box" role="alert"></div>

  <!-- Header -->
  <div class="header">
    <h1>Dokumentasi Foto Operasional Dapur</h1>
    <p>SPPG KOTA SERANG &bull; SERANG SERANG 2</p>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <span id="netBadge" class="badge badge-online">ONLINE</span>
      <span id="offlineReadyBadge" class="badge-cache" style="display:none;">MODE OFFLINE SIAP</span>
      <span id="queueSummary" class="queue-summary">Menunggu: 0 | Terkirim: 0 | Gagal: 0</span>
    </div>
    <div class="status-right">
      <button type="button" id="btnManualSync" class="btn-sync-small">Sinkronkan</button>
    </div>
  </div>

  <div class="container">
    <!-- 1. Kategori Dokumentasi -->
    <div class="card">
      <div class="section-title">1. Pilih Kategori Dokumentasi</div>
      <ul class="category-list" id="categoryList">
        <li class="category-item">
          <label class="category-label selected" data-val="1. Absensi">
            <input type="radio" name="kategori" value="1. Absensi" class="category-radio" checked>
            1. Absensi
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="2. Area depan dapur/parkiran">
            <input type="radio" name="kategori" value="2. Area depan dapur/parkiran" class="category-radio">
            2. Area depan dapur/parkiran
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="3. Bahan baku datang">
            <input type="radio" name="kategori" value="3. Bahan baku datang" class="category-radio">
            3. Bahan baku datang
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="4. Limbah B3 (jika ada)">
            <input type="radio" name="kategori" value="4. Limbah B3 (jika ada)" class="category-radio">
            4. Limbah B3 (jika ada)
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="5. Saat pengambilan Sampah/Limbah">
            <input type="radio" name="kategori" value="5. Saat pengambilan Sampah/Limbah" class="category-radio">
            5. Saat pengambilan Sampah/Limbah
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="6. Isi tabung Gas">
            <input type="radio" name="kategori" value="6. Isi tabung Gas" class="category-radio">
            6. Isi tabung Gas
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="7. Isi Galon">
            <input type="radio" name="kategori" value="7. Isi Galon" class="category-radio">
            7. Isi Galon
          </label>
        </li>
         <li class="category-item">
          <label class="category-label" data-val="8. Terima Paket Shoppe /Indomaret">
            <input type="radio" name="kategori" value="8. Terima Paket Shoppe /Indomaret" class="category-radio">
            8. Terima Paket Shoppe /Indomaret
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="9. Peralatan Baru/Rusak (Jika Ada)">
            <input type="radio" name="kategori" value="9. Peralatan Baru/Rusak (Jika Ada)" class="category-radio">
            9. Peralatan Baru/Rusak (Jika Ada)
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="10. Perbaikan Dapur / Lainnya">
            <input type="radio" name="kategori" value="10. Perbaikan Dapur / Lainnya" class="category-radio">
            10. Perbaikan Dapur / Lainnya
          </label>
        </li>
        <li class="category-item">
          <label class="category-label" data-val="11. Serah Terima Scurity - Cleaning Service">
            <input type="radio" name="kategori" value="11. Serah Terima Scurity - Cleaning Service" class="category-radio">
            11. Serah Terima Scurity - Cleaning Service
          </label>
        </li>
      </ul>

      <div class="input-group">
        <label for="inputKeterangan" class="input-label">Nama Petugas:</label>
        <input type="text" id="inputKeterangan" class="text-input" placeholder="Bapak Lili">
      </div>
    </div>

    <!-- 2. 10 Kolom Foto -->
    <div class="card">
      <div class="section-title">2. Ambil / Pilih Foto (10 Kolom)</div>
      <div class="slots-grid" id="slotsGrid"></div>
    </div>

    <!-- 3. Panel Status Antrean Sinkronisasi -->
    <div class="card">
      <div class="section-title">3. Status Antrean Sinkronisasi</div>
      <div id="queuePanelList" class="empty-queue-msg">Belum ada riwayat antrean foto.</div>
      <div class="queue-actions">
        <button type="button" id="btnClearSent" class="btn-clear-sent">Bersihkan Terkirim</button>
        <button type="button" id="btnRetryAll" class="btn-retry">Coba Kirim Ulang</button>
      </div>
    </div>
  </div>

  <!-- Tombol Kirim Instan -->
  <div class="bottom-bar">
    <div class="bottom-inner">
      <button type="button" id="btnKirim" class="btn-submit">KIRIM DOKUMENTASI (0 FOTO)</button>
    </div>
  </div>

  <script>
    /**
     * APLIKASI DOKUMENTASI FOTO FULL OFFLINE-FIRST (ES5, SINGLE-FILE, ANTI GAGAL)
     * - Dapat dibuka tanpa koneksi internet (Service Worker Cache Storage + Local Shell)
     * - Kompatibel Android 1 - terbaru, RAM 1GB+, dan WebView pratinjau.
     * - Otomatis mengirim antrean foto di latar belakang saat koneksi online kembali.
     */
    (function() {
      'use strict';

      // =====================================================================
      // KONFIGURASI TELEGRAM & KOMPRESI
      // =====================================================================
      var BOT_TOKEN = '9291689649:AAEJECiTaHEkkdWSiDT_rmj-wR_YvkfJjw0';
      var CHAT_ID = '9212263609';
      var SEND_PHOTO_URL = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto';
      var SEND_MEDIA_GROUP_URL = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMediaGroup';

      var TOTAL_SLOTS = 10;
      var PRIMARY_MAX_DIM = 960;
      var FALLBACK_MAX_DIM = 800;
      var JPEG_QUALITY = 0.68;
      var MAX_RAW_FALLBACK_BYTES = 2 * 1024 * 1024; // 2MB batas fallback mentah agar tidak membebani memori

      // State Aplikasi
      var selectedCategory = '1. Absensi';
      var slotPhotos = new Array(TOTAL_SLOTS); // { dataUrl, timestamp, info }
      var isSyncing = false;
      var toastTimer = null;

      // Penyimpanan Offline (IndexedDB -> localStorage -> In-Memory fallback)
      var DB_NAME = 'DokFotoOfflineV2';
      var DB_VERSION = 1;
      var STORE_NAME = 'queueItems';
      var dbInstance = null;
      var storageMode = 'memory'; // 'indexeddb' | 'localstorage' | 'memory'
      var LS_KEY = 'dok_foto_queue_v2';
      var SHELL_CACHE_NAME = 'dok-foto-shell-v1';
      var SHELL_LS_KEY = 'dok_foto_app_shell_html_v1';
      var memoryQueue = [];
      var memorySeq = 1;

      // =====================================================================
      // OFFLINE APP SHELL CACHE (AGAR HALAMAN BISA DIBUKA TANPA INTERNET)
      // =====================================================================
      function markOfflineShellReady() {
        var badge = document.getElementById('offlineReadyBadge');
        if (badge) {
          badge.style.display = 'inline-block';
        }
      }

      function initOfflineAppShell() {
        var pageUrl = window.location.href.split('#')[0];
        var protocol = window.location.protocol;

        // Jika dibuka langsung dari penyimpanan lokal HP (file://), sistem otomatis bisa dibuka offline
        if (protocol === 'file:') {
          markOfflineShellReady();
          return;
        }

        // 1. Simpan snapshot HTML ke localStorage sebagai cadangan tambahan
        try {
          if (document.documentElement && document.documentElement.outerHTML) {
            localStorage.setItem(SHELL_LS_KEY, '<!DOCTYPE html>\n' + document.documentElement.outerHTML);
          }
        } catch (eLsShell) {}

        // 2. Simpan halaman ke Cache Storage & daftarkan Service Worker dinamis (jika HTTPS / localhost)
        if ('caches' in window && (protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
          try {
            var fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            caches.open(SHELL_CACHE_NAME).then(function(cache) {
              var resp = new Response(fullHtml, {
                status: 200,
                statusText: 'OK',
                headers: { 'Content-Type': 'text/html; charset=utf-8' }
              });
              return cache.put(pageUrl, resp);
            }).then(function() {
              markOfflineShellReady();
            }).catch(function() {});
          } catch (eCache) {}

          if ('serviceWorker' in navigator && typeof Blob !== 'undefined' && window.URL && window.URL.createObjectURL) {
            try {
              var swCode =
                "var CACHE_NAME='" + SHELL_CACHE_NAME + "';" +
                "self.addEventListener('install',function(e){self.skipWaiting();});" +
                "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});" +
                "self.addEventListener('fetch',function(e){" +
                "  if(e.request.method!=='GET')return;" +
                "  if(e.request.mode==='navigate'||(e.request.headers.get('accept')||'').indexOf('text/html')!==-1){" +
                "    e.respondWith(" +
                "      fetch(e.request).then(function(res){" +
                "        var copy=res.clone();" +
                "        caches.open(CACHE_NAME).then(function(c){c.put(e.request,copy);});" +
                "        return res;" +
                "      }).catch(function(){" +
                "        return caches.match(e.request,{ignoreSearch:true}).then(function(cached){" +
                "          return cached||caches.match('" + pageUrl.replace(/'/g, "\\'") + "');" +
                "        });" +
                "      })" +
                "    );" +
                "  }" +
                "});";
              var swBlob = new Blob([swCode], { type: 'application/javascript' });
              var swUrl = window.URL.createObjectURL(swBlob);
              navigator.serviceWorker.register(swUrl).then(function() {
                markOfflineShellReady();
              }).catch(function() {});
            } catch (eSw) {}
          }
        }
      }

      // =====================================================================
      // UTILITAS UI & FORMAT
      // =====================================================================
      function showToast(message, type) {
        var box = document.getElementById('toastBox');
        if (!box) return;
        box.textContent = message;
        box.className = 'toast-box ' + (type || 'toast-success');
        box.style.display = 'block';

        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(function() {
          box.style.display = 'none';
        }, 3800);
      }

      function formatTanggalIndo(dateObj) {
        var d = dateObj || new Date();
        var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() +
               ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }

      function isOnlineNow() {
        if (typeof navigator !== 'undefined' && typeof navigator.onLine === 'boolean') {
          return navigator.onLine;
        }
        return true;
      }

      function updateNetworkBadge() {
        var badge = document.getElementById('netBadge');
        if (!badge) return;
        if (isOnlineNow()) {
          badge.textContent = 'ONLINE';
          badge.className = 'badge badge-online';
        } else {
          badge.textContent = 'OFFLINE';
          badge.className = 'badge badge-offline';
        }
      }

      function updateSubmitButton() {
        var count = 0;
        for (var i = 0; i < TOTAL_SLOTS; i++) {
          if (slotPhotos[i]) count++;
        }
        var btn = document.getElementById('btnKirim');
        if (btn) {
          btn.textContent = 'KIRIM DOKUMENTASI (' + count + ' FOTO)';
        }
      }

      // =====================================================================
      // KATEGORI DOKUMENTASI
      // =====================================================================
      function initCategories() {
        var list = document.getElementById('categoryList');
        if (!list) return;
        var labels = list.getElementsByTagName('label');

        for (var i = 0; i < labels.length; i++) {
          (function(lbl) {
            lbl.addEventListener('click', function() {
              for (var j = 0; j < labels.length; j++) {
                labels[j].className = 'category-label';
              }
              lbl.className = 'category-label selected';
              var radio = lbl.getElementsByTagName('input')[0];
              if (radio) {
                radio.checked = true;
                selectedCategory = radio.value;
              }
            });
          })(labels[i]);
        }
      }

      // =====================================================================
      // 10 KOLOM UPLOAD FOTO & RESET INPUT FILE (KAMERA ATAU GALERI)
      // =====================================================================
      function buildSlotEmptyHtml(idx) {
        var num = idx + 1;
        return '<label class="slot-trigger" for="fileInput_' + idx + '" id="slotTrigger_' + idx + '">' +
                 '<span class="slot-number">Foto ' + num + '</span>' +
                 '<span class="slot-icon">+</span>' +
                 '<span class="slot-hint">Kamera / Galeri</span>' +
               '</label>' +
               '<input type="file" accept="image/*" class="slot-input" id="fileInput_' + idx + '" data-index="' + idx + '">';
      }

      function initSlots() {
        var grid = document.getElementById('slotsGrid');
        if (!grid) return;
        var html = '';
        for (var i = 0; i < TOTAL_SLOTS; i++) {
          html += '<div class="slot-wrapper">' +
                    '<div class="slot-box" id="slotBox_' + i + '">' +
                      buildSlotEmptyHtml(i) +

                  '</div>';

      function bindSlotInput(idx) {
        var inputEl = document.getElementById('fileInput_' + idx);
        if (!inputEl) return;
        inputEl.onchange = function(e) {
          var files = (e && e.target && e.target.files) ? e.target.files : inputEl.files;
          handleFileSelect(idx, files);
        };
      }

      function resetFileInputElement(idx) {
        var inputEl = document.getElementById('fileInput_' + idx);
        if (!inputEl) return;
        try {
          inputEl.value = '';
        } catch (err) {
          var parent = inputEl.parentNode;
          if (parent) {
            var newInput = document.createElement('input');
            newInput.type = 'file';
            newInput.accept = 'image/*';
            newInput.className = 'slot-input';
            newInput.id = 'fileInput_' + idx;
            newInput.setAttribute('data-index', String(idx));
            parent.replaceChild(newInput, inputEl);
            bindSlotInput(idx);

      function renderSlotFilled(idx, dataUrl) {
        var box = document.getElementById('slotBox_' + idx);
        if (!box) return;
        var num = idx + 1;
        box.className = 'slot-box has-photo';
        box.innerHTML = '<img src="' + dataUrl + '" class="slot-preview" alt="Foto ' + num + '">' +
                        '<span class="slot-badge-top">Foto ' + num + '</span>' +
                        '<button type="button" class="slot-remove-btn" id="removeBtn_' + idx + '" title="Hapus Foto">X</button>';

        var rmBtn = document.getElementById('removeBtn_' + idx);
        if (rmBtn) {
          rmBtn.onclick = function(e) {
            if (e) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
            }
            clearSingleSlot(idx);
          };

      function clearSingleSlot(idx) {
        slotPhotos[idx] = null;
        var box = document.getElementById('slotBox_' + idx);
        if (!box) return;
        box.className = 'slot-box';
        box.innerHTML = buildSlotEmptyHtml(idx);
        bindSlotInput(idx);
        resetFileInputElement(idx);
        updateSubmitButton();
      }

      function resetAllSlots() {
        for (var i = 0; i < TOTAL_SLOTS; i++) {
          clearSingleSlot(i);
        }
      }

      // =====================================================================
      // PEMROSESAN FOTO BERLAPIS & KOMPRESI AMAN (ANDROID 1 - TERBARU, RAM 1GB+)
      // =====================================================================
      function handleFileSelect(idx, files) {
        if (!files || !files.length) {
          resetFileInputElement(idx);
          return;
        }
        var file = files[0];
        if (!file) {
          resetFileInputElement(idx);
          return;
        }

        var box = document.getElementById('slotBox_' + idx);
        if (box) {
          box.className = 'slot-box processing';
          var trig = document.getElementById('slotTrigger_' + idx);
          if (trig) {
            trig.innerHTML = '<span class="slot-number">Foto ' + (idx + 1) + '</span>' +
                             '<span class="slot-hint" style="margin-top:12px;font-weight:bold;">Memproses...</span>';
          }
        }

        processPhotoWithFallbacks(file, function(errReason, resultDataUrl) {
          resetFileInputElement(idx);

          if (errReason || !resultDataUrl) {
            var reasonText = errReason ? String(errReason) : 'Data gambar kosong';
            showToast('Gagal memproses foto (' + reasonText + '). Coba ambil ulang.', 'toast-error');
            clearSingleSlot(idx);
            return;
          }

          slotPhotos[idx] = {
            dataUrl: resultDataUrl,
            timestamp: formatTanggalIndo(new Date())
          };

          renderSlotFilled(idx, resultDataUrl);
          updateSubmitButton();
        });
      }

      function readFileAsImageSource(file, callback) {
        var settled = false;
        function done(err, srcUrl, isObjectUrl) {
          if (settled) return;
          settled = true;
          callback(err, srcUrl, isObjectUrl);
        }

        function tryObjectUrl(prevErr) {
          var URLObj = (typeof window !== 'undefined') ? (window.URL || window.webkitURL) : null;
          if (URLObj && typeof URLObj.createObjectURL === 'function') {
            try {
              var objUrl = URLObj.createObjectURL(file);
              if (objUrl) {
                done(null, objUrl, true);
                return;
              }
            } catch (eObj) {
              done('ObjectURL gagal: ' + (eObj.message || 'error'), null, false);
              return;
            }
          }
          done(prevErr || 'Metode baca file tidak didukung', null, false);
        }

        if (typeof FileReader !== 'undefined') {
          try {
            var reader = new FileReader();
            reader.onload = function(ev) {
              var res = (ev && ev.target && ev.target.result) ? ev.target.result : reader.result;
              if (res && typeof res === 'string' && res.indexOf('data:') === 0) {
                done(null, res, false);
              } else {
                tryObjectUrl('Hasil FileReader kosong');
              }
            };
            reader.onerror = function() {
              tryObjectUrl('FileReader error');
            };
            reader.onabort = function() {
              tryObjectUrl('FileReader dibatalkan');
            };
            reader.readAsDataURL(file);
            return;
          } catch (eReader) {
            tryObjectUrl('FileReader exception');
            return;
          }
        }

        tryObjectUrl('FileReader tidak tersedia');
      }

      function renderImageToCompressedDataUrl(img, maxDim, quality) {
        var natW = img.naturalWidth || img.width || 0;
        var natH = img.naturalHeight || img.height || 0;
        if (!natW || !natH) {
          throw new Error('Dimensi gambar 0');
        }

        var targetW = natW;
        var targetH = natH;
        if (targetW > targetH) {
          if (targetW > maxDim) {
            targetH = Math.max(1, Math.round(targetH * (maxDim / targetW)));
            targetW = maxDim;
          }
        } else {
          if (targetH > maxDim) {
            targetW = Math.max(1, Math.round(targetW * (maxDim / targetH)));
            targetH = maxDim;
          }
        }

        var canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;

        var ctx = canvas.getContext('2d');
        if (!ctx) {
          canvas.width = 1;
          canvas.height = 1;
          throw new Error('Canvas 2D tidak tersedia');
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetW, targetH);
        ctx.drawImage(img, 0, 0, targetW, targetH);

        var dataUrl = null;
        try {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        } catch (eToDataUrl) {
          try {
            dataUrl = canvas.toDataURL('image/jpeg');
          } catch (eFallbackType) {
            dataUrl = canvas.toDataURL();
          }
        }

        try {
          ctx.clearRect(0, 0, targetW, targetH);
          canvas.width = 1;
          canvas.height = 1;
        } catch (eClean) {}
        ctx = null;
        canvas = null;

        if (!dataUrl || typeof dataUrl !== 'string' || dataUrl.indexOf('data:image') !== 0 || dataUrl.length < 100) {
          throw new Error('toDataURL gagal/kosong');
        }

        return dataUrl;
      }

      function processPhotoWithFallbacks(file, callback) {
        readFileAsImageSource(file, function(readErr, srcUrl, isObjectUrl) {
          var URLObj = (typeof window !== 'undefined') ? (window.URL || window.webkitURL) : null;

          function revokeIfNeeded() {
            if (isObjectUrl && URLObj && typeof URLObj.revokeObjectURL === 'function' && srcUrl) {
              try {
                URLObj.revokeObjectURL(srcUrl);
              } catch (eRev) {}
            }
          }

          if (readErr || !srcUrl) {
            callback(readErr || 'Gagal membaca file', null);
            return;
          }

          var img = new Image();
          try {
            img.crossOrigin = 'anonymous';
          } catch (eCors) {}

          var finished = false;
          function finishWith(errMsg, outDataUrl) {
            if (finished) return;
            finished = true;
            revokeIfNeeded();
            try {
              img.onload = null;
              img.onerror = null;
              img.src = '';
            } catch (eImgClean) {}
            img = null;
            callback(errMsg, outDataUrl);
          }

          function runCompressionStages() {
            try {
              var out1 = renderImageToCompressedDataUrl(img, PRIMARY_MAX_DIM, JPEG_QUALITY);
              finishWith(null, out1);
              return;
            } catch (eStage1) {
              try {
                var out2 = renderImageToCompressedDataUrl(img, FALLBACK_MAX_DIM, JPEG_QUALITY);
                finishWith(null, out2);
                return;
              } catch (eStage2) {
                if (!isObjectUrl && typeof srcUrl === 'string' && srcUrl.indexOf('data:image') === 0) {
                  var approxBytes = Math.round((srcUrl.length * 3) / 4);
                  if (approxBytes <= MAX_RAW_FALLBACK_BYTES) {
                    finishWith(null, srcUrl);
                    return;
                  }
                }
                finishWith('Kompresi gagal: ' + (eStage2.message || eStage1.message || 'memori penuh'), null);
              }
            }
          }

          img.onload = function() {
            if (typeof img.decode === 'function') {
              try {
                img.decode().then(function() {
                  runCompressionStages();
                }, function() {
                  runCompressionStages();
                });
                return;
              } catch (eDecode) {
                runCompressionStages();
                return;
              }
            }
            runCompressionStages();
          };

          img.onerror = function() {
            if (!isObjectUrl && typeof srcUrl === 'string' && srcUrl.indexOf('data:image') === 0) {
              var approxBytes = Math.round((srcUrl.length * 3) / 4);
              if (approxBytes <= MAX_RAW_FALLBACK_BYTES) {
                finishWith(null, srcUrl);
                return;
              }
            }
            finishWith('Gambar tidak dapat dimuat', null);
          };

          img.src = srcUrl;
        });
      }

      // =====================================================================
      // PENYIMPANAN LOKAL (INDEXEDDB -> LOCALSTORAGE -> MEMORY)
      // =====================================================================
      function loadMemoryFromLocalStorage() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          return (parsed && parsed.length) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveMemoryToLocalStorage(list) {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(list));
          return true;
        } catch (e) {
          return false;
        }
      }

      function initStorage(callback) {
        var idb = (typeof window !== 'undefined')
          ? (window.indexedDB || window.mozIndexedDB || window.webkitIndexedDB || window.msIndexedDB)
          : null;

        if (!idb) {
          storageMode = 'localstorage';
          memoryQueue = loadMemoryFromLocalStorage();
          if (callback) callback();
          return;
        }

        try {
          var req = idb.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
          };
          req.onsuccess = function(e) {
            dbInstance = e.target.result;
            storageMode = 'indexeddb';
            if (callback) callback();
          };
          req.onerror = function() {
            storageMode = 'localstorage';
            memoryQueue = loadMemoryFromLocalStorage();
            if (callback) callback();
          };
        } catch (err) {
          storageMode = 'localstorage';
          memoryQueue = loadMemoryFromLocalStorage();
          if (callback) callback();
        }
      }

      function addQueueItems(newItems, callback) {
        if (storageMode === 'indexeddb' && dbInstance) {
          try {
            var tx = dbInstance.transaction([STORE_NAME], 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            for (var i = 0; i < newItems.length; i++) {
              store.add(newItems[i]);
            }
            tx.oncomplete = function() {
              if (callback) callback(null);
            };
            tx.onerror = function() {
              for (var k = 0; k < newItems.length; k++) {
                newItems[k].id = 'mem_' + (memorySeq++) + '_' + Date.now();
                memoryQueue.push(newItems[k]);
              }
              saveMemoryToLocalStorage(memoryQueue);
              if (callback) callback(null);
            };
            return;
          } catch (eIdb) {}
        }

        for (var j = 0; j < newItems.length; j++) {
          newItems[j].id = 'mem_' + (memorySeq++) + '_' + Date.now();
          memoryQueue.push(newItems[j]);
        }
        if (storageMode === 'localstorage') {
          if (!saveMemoryToLocalStorage(memoryQueue)) {
            storageMode = 'memory';
          }
        }
        if (callback) callback(null);
      }

      function fetchAllQueueItems(callback) {
        if (storageMode === 'indexeddb' && dbInstance) {
          try {
            var tx = dbInstance.transaction([STORE_NAME], 'readonly');
            var store = tx.objectStore(STORE_NAME);
            var list = [];
            var cursorReq = store.openCursor();
            cursorReq.onsuccess = function(e) {
              var cursor = e.target.result;
              if (cursor) {
                list.push(cursor.value);
                cursor.continue();
              } else {
                callback(null, list);
              }
            };
            cursorReq.onerror = function() {
              callback(null, memoryQueue.slice(0));
            };
            return;
          } catch (e) {
            callback(null, memoryQueue.slice(0));
            return;
          }
        }

        if (storageMode === 'localstorage') {
          memoryQueue = loadMemoryFromLocalStorage();
        }
        callback(null, memoryQueue.slice(0));
      }

      function updateQueueItem(item, callback) {
        if (storageMode === 'indexeddb' && dbInstance) {
          try {
            var tx = dbInstance.transaction([STORE_NAME], 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            store.put(item);
            tx.oncomplete = function() {
              if (callback) callback();
            };
            tx.onerror = function() {
              if (callback) callback();
            };
            return;
          } catch (e) {}
        }

        for (var i = 0; i < memoryQueue.length; i++) {
          if (memoryQueue[i].id === item.id) {
            memoryQueue[i] = item;
            break;
          }
        }
        if (storageMode === 'localstorage') {
          saveMemoryToLocalStorage(memoryQueue);
        }
        if (callback) callback();
      }

      function removeSentItems(callback) {
        if (storageMode === 'indexeddb' && dbInstance) {
          fetchAllQueueItems(function(err, items) {
            try {
              var tx = dbInstance.transaction([STORE_NAME], 'readwrite');
              var store = tx.objectStore(STORE_NAME);
              for (var i = 0; i < items.length; i++) {
                if (items[i].status === 'sent') {
                  store.delete(items[i].id);
                }
              }
              tx.oncomplete = function() {
                if (callback) callback();
              };
              tx.onerror = function() {
                if (callback) callback();
              };
            } catch (e) {
              if (callback) callback();
            }
          });
          return;
        }

        var kept = [];
        for (var j = 0; j < memoryQueue.length; j++) {
          if (memoryQueue[j].status !== 'sent') {
            kept.push(memoryQueue[j]);
          }
        }
        memoryQueue = kept;
        if (storageMode === 'localstorage') {
          saveMemoryToLocalStorage(memoryQueue);
        }
        if (callback) callback();
      }

      function resetFailedToPending(callback) {
        fetchAllQueueItems(function(err, items) {
          var idx = 0;
          function step() {
            if (idx >= items.length) {
              if (callback) callback();
              return;
            }
            var it = items[idx++];
            if (it.status === 'failed') {
              it.status = 'pending';
              it.lastError = '';
              updateQueueItem(it, step);
            } else {
              step();
            }
          }
          step();
        });
      }

      // =====================================================================
      // RENDER PANEL STATUS ANTREAN
      // =====================================================================
      function refreshQueueUI(callback) {
        fetchAllQueueItems(function(err, items) {
          var list = items || [];
          var pendingCount = 0;
          var sentCount = 0;
          var failedCount = 0;

          for (var i = 0; i < list.length; i++) {
            if (list[i].status === 'sent') sentCount++;
            else if (list[i].status === 'failed') failedCount++;
            else pendingCount++;
          }

          var summaryEl = document.getElementById('queueSummary');
          if (summaryEl) {
            summaryEl.textContent = 'Menunggu: ' + pendingCount + ' | Terkirim: ' + sentCount + ' | Gagal: ' + failedCount;
          }

          var panelEl = document.getElementById('queuePanelList');
          if (panelEl) {
            if (list.length === 0) {
              panelEl.className = 'empty-queue-msg';
              panelEl.textContent = 'Belum ada antrean foto.';
            } else {
              panelEl.className = '';
              var startIdx = list.length > 15 ? list.length - 15 : 0;
              var html = '<ul class="queue-list">';
              for (var j = list.length - 1; j >= startIdx; j--) {
                var item = list[j];
                var statusLabel = 'Menunggu';
                var statusClass = 'q-status-pending';
                if (item.status === 'sent') {
                  statusLabel = 'Terkirim';
                  statusClass = 'q-status-sent';
                } else if (item.status === 'failed') {
                  statusLabel = 'Gagal' + (item.lastError ? ' (' + item.lastError + ')' : '');
                  statusClass = 'q-status-failed';
                }

                html += '<li class="queue-item">' +
                          '<div class="queue-item-top">' + escapeHtml(item.category) + ' &bull; Foto ' + item.photoIndex + '/' + item.totalInBatch + '</div>' +
                          '<div class="queue-item-meta">' + escapeHtml(item.timestamp) + (item.keterangan ? ' &bull; ' + escapeHtml(item.keterangan) : '') + '</div>' +
                          '<div class="' + statusClass + '">Status: ' + escapeHtml(statusLabel) + '</div>' +
                        '</li>';
              }
              html += '</ul>';
              panelEl.innerHTML = html;
            }
          }

          if (callback) {
            callback({
              all: list,
              pendingCount: pendingCount,
              sentCount: sentCount,
              failedCount: failedCount
            });
          }
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // =====================================================================
      // TOMBOL KIRIM DOKUMENTASI (INSTANT SUCCESS & BACKGROUND SYNC)
      // =====================================================================
      function handleInstantSubmit() {
        var collected = [];
        for (var i = 0; i < TOTAL_SLOTS; i++) {
          if (slotPhotos[i]) {
            collected.push(slotPhotos[i]);
          }
        }

        if (collected.length === 0) {
          showToast('Pilih atau ambil minimal 1 foto terlebih dahulu!', 'toast-error');
          return;
        }

        var ketEl = document.getElementById('inputKeterangan');
        var keteranganVal = ketEl ? String(ketEl.value || '').replace(/^\s+|\s+$/g, '') : '';
        var totalBatch = collected.length;
        var batchId = 'B' + Date.now();

        var newItems = [];
        for (var j = 0; j < totalBatch; j++) {
          newItems.push({
            batchId: batchId,
            category: selectedCategory,
            keterangan: keteranganVal,
            photoIndex: j + 1,
            totalInBatch: totalBatch,
            timestamp: collected[j].timestamp,
            dataUrl: collected[j].dataUrl,
            status: 'pending',
            lastError: ''
          });
        }

        addQueueItems(newItems, function(err) {
          if (err) {
            showToast('Gagal menyimpan ke memori lokal.', 'toast-error');
            return;
          }

          if (isOnlineNow()) {
            showToast('Tersimpan & dikirim di latar belakang (' + totalBatch + ' foto)', 'toast-success');
          } else {
            showToast('Tersimpan di HP (' + totalBatch + ' foto). Otomatis terkirim saat internet aktif.', 'toast-info');
          }

          resetAllSlots();
          if (ketEl) {
            ketEl.value = '';
          }

          refreshQueueUI(function() {
            triggerBackgroundSync();
          });
        });
      }

      // =====================================================================
      // PENGIRIMAN KE TELEGRAM (sendMediaGroup / sendPhoto VIA XHR)
      // =====================================================================
      function dataUrlToBlobSafe(dataUrl) {
        var parts = dataUrl.split(',');
        var mime = 'image/jpeg';
        if (parts[0] && parts[0].indexOf(':') !== -1) {
          var mPart = parts[0].split(':')[1].split(';')[0];
          if (mPart) mime = mPart;
        }
        var byteStr = atob(parts[1] || '');
        var len = byteStr.length;
        var ab = new ArrayBuffer(len);
        var ia = new Uint8Array(ab);
        for (var i = 0; i < len; i++) {
          ia[i] = byteStr.charCodeAt(i);
        }
        try {
          return new Blob([ab], { type: mime });
        } catch (eBlob) {
          var BlobBuilder = window.BlobBuilder || window.WebKitBlobBuilder || window.MozBlobBuilder;
          if (BlobBuilder) {
            var bb = new BlobBuilder();
            bb.append(ab);
            return bb.getBlob(mime);
          }
          throw eBlob;
        }
      }

      function buildCaption(item) {
        var lines = [
          'DOKUMENTASI OPERASIONAL',
          'Kategori: ' + item.category,
          'Foto ke: ' + item.photoIndex + ' dari ' + item.totalInBatch,
          'Waktu: ' + item.timestamp
        ];
        if (item.keterangan) {
          lines.push('Keterangan: ' + item.keterangan);
        }
        return lines.join('\n');
      }

      function sendPhotoItem(item, callback) {
        try {
          var blob = dataUrlToBlobSafe(item.dataUrl);
          var formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', blob, 'foto_' + item.photoIndex + '.jpg');
          formData.append('caption', buildCaption(item));

          var xhr = new XMLHttpRequest();
          xhr.open('POST', SEND_PHOTO_URL, true);
          xhr.timeout = 45000;

          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              if (xhr.status >= 200 && xhr.status < 300) {
                try {
                  var resp = JSON.parse(xhr.responseText);
                  if (resp && resp.ok) {
                    callback(true, '');
                    return;
                  }
                  callback(false, (resp && resp.description) ? resp.description : 'API Telegram menolak');
                } catch (eParse) {
                  callback(false, 'Respon tidak valid');
                }
              } else {
                callback(false, 'HTTP ' + (xhr.status || 'gagal'));
              }
            }
          };

          xhr.onerror = function() {
            callback(false, 'Koneksi terputus');
          };

          xhr.ontimeout = function() {
            callback(false, 'Timeout jaringan');
          };

          xhr.send(formData);
        } catch (err) {
          callback(false, err.message || 'Gagal menyiapkan upload');
        }
      }

      function sendBatchMediaGroupOrFallback(batchItems, onAllDone) {
        if (batchItems.length < 2 || typeof FormData === 'undefined') {
          var idxSingle = 0;
          function nextSingle() {
            if (idxSingle >= batchItems.length) {
              onAllDone();
              return;
            }
            var cur = batchItems[idxSingle++];
            sendPhotoItem(cur, function(ok, errReason) {
              cur.status = ok ? 'sent' : 'failed';
              cur.lastError = ok ? '' : errReason;
              updateQueueItem(cur, nextSingle);
            });
          }
          nextSingle();
          return;
        }

        try {
          var formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          var mediaArr = [];

          for (var i = 0; i < batchItems.length; i++) {
            var attachName = 'file_' + i;
            var blob = dataUrlToBlobSafe(batchItems[i].dataUrl);
            formData.append(attachName, blob, 'foto_' + batchItems[i].photoIndex + '.jpg');

            var mediaObj = {
              type: 'photo',
              media: 'attach://' + attachName
            };
            if (i === 0) {
              mediaObj.caption = 'DOKUMENTASI OPERASIONAL\nKategori: ' + batchItems[i].category +
                                 '\nJumlah Foto: ' + batchItems[i].totalInBatch +
                                 '\nWaktu: ' + batchItems[i].timestamp +
                                 (batchItems[i].keterangan ? '\nKeterangan: ' + batchItems[i].keterangan : '');
            }
            mediaArr.push(mediaObj);
          }

          formData.append('media', JSON.stringify(mediaArr));

          var xhr = new XMLHttpRequest();
          xhr.open('POST', SEND_MEDIA_GROUP_URL, true);
          xhr.timeout = 60000;

          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              var groupOk = false;
              var groupErr = 'Gagal kirim grup';
              if (xhr.status >= 200 && xhr.status < 300) {
                try {
                  var res = JSON.parse(xhr.responseText);
                  if (res && res.ok) {
                    groupOk = true;
                  } else if (res && res.description) {
                    groupErr = res.description;
                  }
                } catch (eP) {
                  groupErr = 'Respon grup tidak valid';
                }
              } else {
                groupErr = 'HTTP ' + (xhr.status || 'gagal');
              }

              if (groupOk) {
                var uIdx = 0;
                function markSent() {
                  if (uIdx >= batchItems.length) {
                    onAllDone();
                    return;
                  }
                  batchItems[uIdx].status = 'sent';
                  batchItems[uIdx].lastError = '';
                  var target = batchItems[uIdx++];
                  updateQueueItem(target, markSent);
                }
                markSent();
              } else {
                var fIdx = 0;
                function fallbackSingle() {
                  if (fIdx >= batchItems.length) {
                    onAllDone();
                    return;
                  }
                  var item = batchItems[fIdx++];
                  sendPhotoItem(item, function(ok2, err2) {
                    item.status = ok2 ? 'sent' : 'failed';
                    item.lastError = ok2 ? '' : (err2 || groupErr);
                    updateQueueItem(item, fallbackSingle);
                  });
                }
                fallbackSingle();
              }
            }
          };

          xhr.onerror = function() {
            var eIdx = 0;
            function markErr() {
              if (eIdx >= batchItems.length) {
                onAllDone();
                return;
              }
              batchItems[eIdx].status = 'failed';
              batchItems[eIdx].lastError = 'Koneksi terputus';
              var target = batchItems[eIdx++];
              updateQueueItem(target, markErr);
            }
            markErr();
          };

          xhr.ontimeout = function() {
            var tIdx = 0;
            function markTime() {
              if (tIdx >= batchItems.length) {
                onAllDone();
                return;
              }
              batchItems[tIdx].status = 'failed';
              batchItems[tIdx].lastError = 'Timeout jaringan';
              var target = batchItems[tIdx++];
              updateQueueItem(target, markTime);
            }
            markTime();
          };

          xhr.send(formData);
        } catch (eGroup) {
          var sIdx = 0;
          function fallbackOnCatch() {
            if (sIdx >= batchItems.length) {
              onAllDone();
              return;
            }
            var item = batchItems[sIdx++];
            sendPhotoItem(item, function(ok3, err3) {
              item.status = ok3 ? 'sent' : 'failed';
              item.lastError = ok3 ? '' : err3;
              updateQueueItem(item, fallbackOnCatch);
            });
          }
          fallbackOnCatch();
        }
      }

      function triggerBackgroundSync() {
        updateNetworkBadge();

        if (!isOnlineNow()) {
          refreshQueueUI();
          return;
        }

        if (isSyncing) {
          return;
        }

        fetchAllQueueItems(function(err, items) {
          var pendingList = [];
          for (var i = 0; i < (items || []).length; i++) {
            if (items[i].status === 'pending') {
              pendingList.push(items[i]);
            }
          }

          if (pendingList.length === 0) {
            isSyncing = false;
            refreshQueueUI();
            return;
          }

          isSyncing = true;

          var firstItem = pendingList[0];
          var sameBatch = [];
          for (var j = 0; j < pendingList.length; j++) {
            if (pendingList[j].batchId === firstItem.batchId) {
              sameBatch.push(pendingList[j]);
            }
          }

          sendBatchMediaGroupOrFallback(sameBatch, function() {
            isSyncing = false;
            refreshQueueUI(function(info) {
              if (info.pendingCount > 0 && isOnlineNow()) {
                setTimeout(triggerBackgroundSync, 700);
              }
            });
          });
        });
      }

      // =====================================================================
      // EVENT LISTENERS & BOOTSTRAP
      // =====================================================================
      window.addEventListener('online', function() {
        updateNetworkBadge();
        showToast('Internet terhubung! Mengirim antrean foto di latar belakang...', 'toast-info');
        triggerBackgroundSync();
      });

      window.addEventListener('offline', function() {
        updateNetworkBadge();
        refreshQueueUI();
      });

      // Cek otomatis saat aplikasi kembali dibuka / layar menyala
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && isOnlineNow()) {
          triggerBackgroundSync();
        }
      });

      setInterval(function() {
        triggerBackgroundSync();
      }, 15000);

      function bootstrap() {
        initOfflineAppShell();
        updateNetworkBadge();
        initCategories();
        initSlots();
        updateSubmitButton();

        var btnKirim = document.getElementById('btnKirim');
        if (btnKirim) {
          btnKirim.onclick = handleInstantSubmit;
        }

        var btnManualSync = document.getElementById('btnManualSync');
        if (btnManualSync) {
          btnManualSync.onclick = function() {
            updateNetworkBadge();
            if (!isOnlineNow()) {
              showToast('Perangkat Offline. Antrean akan dikirim otomatis saat online.', 'toast-info');
              return;
            }
            showToast('Menyinkronkan antrean foto ke Telegram...', 'toast-info');
            triggerBackgroundSync();
          };
        }

        var btnRetryAll = document.getElementById('btnRetryAll');
        if (btnRetryAll) {
          btnRetryAll.onclick = function() {
            resetFailedToPending(function() {
              refreshQueueUI(function() {
                if (!isOnlineNow()) {
                  showToast('Status gagal diubah ke Menunggu (Offline).', 'toast-info');
                  return;
                }
                showToast('Mencoba kirim ulang foto yang gagal...', 'toast-info');
                triggerBackgroundSync();
              });
            });
          };
        }

        var btnClearSent = document.getElementById('btnClearSent');
        if (btnClearSent) {
          btnClearSent.onclick = function() {
            removeSentItems(function() {
              refreshQueueUI();
              showToast('Riwayat foto terkirim dibersihkan.', 'toast-info');
            });
          };
        }

        initStorage(function() {
          refreshQueueUI(function(info) {
            if (info.pendingCount > 0 && isOnlineNow()) {
              triggerBackgroundSync();
            }
          });
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
